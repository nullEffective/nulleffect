# nginx config for the NullEffect SPA on Cloud Run.
# try_files falls back to index.html so client-rendered paths
# (/void, /fist) load the app instead of 404ing.
server {
    listen       8080;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
